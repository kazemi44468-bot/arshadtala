name: Live Tehran Gold Union Prices

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch union prices
        run: python scripts/update-prices.py

      - name: Patch homepage price bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="gold-highlight"><div class="item"><i class="fas fa-fire"></i><div><h4>طلای آبشده</h4><p>خلوص بالا · تحویل فوری</p></div><span class="price-tag">۴۳,۲۰۰,۰۰۰</span></div><div class="item"><i class="fas fa-hand-holding-heart"></i><div><h4>طلای دست دوم کم اجرت</h4><p>با کارمزد ویژه · اعتبارسنجی شده</p></div><span class="price-tag">۴۲,۵۰۰,۰۰۰</span></div></div>'''
          current = '''<div class="gold-highlight"><div class="item"><i class="fas fa-fire"></i><div><h4>طلای ۱۸ عیار</h4><p>نرخ مرجع اتحادیه تهران</p></div><span class="price-tag" id="liveGold18">در حال دریافت...</span></div><div class="item"><i class="fas fa-hand-holding-heart"></i><div><h4>طلای آبشده</h4><p>نرخ مرجع اتحادیه تهران</p></div><span class="price-tag" id="liveMelted">در حال دریافت...</span></div></div>'''
          new = '''<div class="gold-highlight"><div class="item"><i class="fas fa-fire"></i><div><h4>طلای ۱۸ عیار</h4><p>نرخ مرجع اتحادیه تهران</p></div><span class="price-tag" id="liveGold18">در حال دریافت...</span></div><div class="item"><i class="fas fa-coins"></i><div><h4>سکه امامی</h4><p>نرخ مرجع اتحادیه تهران</p></div><span class="price-tag" id="liveEmami">در حال دریافت...</span></div></div>'''
          if old in s:
              s = s.replace(old, new)
          elif current in s:
              s = s.replace(current, new)
          marker = '<script>const tickerData='
          start = s.find(marker)
          if start != -1:
              end = s.find('</script>', start)
              if end != -1:
                  script = '''<script>(async()=>{const map={gold18:'liveGold18',emami:'liveEmami'};const labels={ounce:'اونس جهانی',gold18:'طلای ۱۸ عیار',gold24:'طلای ۲۴ عیار',mesghal:'مظنه تهران',emami:'سکه امامی',bahar:'سکه طرح قدیم',half:'نیم سکه',quarter:'ربع سکه',gerami:'سکه گرمی',dollar:'دلار',euro:'یورو',dirham:'درهم'};const format=v=>{if(v==null||v==='')return '—';return new Intl.NumberFormat('fa-IR').format(Number(String(v).replace(/,/g,'')))};const renderTicker=data=>{const p=data.prices||{};const items=Object.keys(labels).filter(k=>p[k]!=null).map(k=>`<span class="item"><span class="label">${labels[k]}</span><span class="price">${format(p[k])}</span></span>`);const track=document.getElementById('tickerTrack');track.innerHTML=[...items,...items].join('')};const load=async()=>{try{const r=await fetch('data/prices.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('price data unavailable');const data=await r.json();Object.entries(map).forEach(([k,id])=>{const el=document.getElementById(id);if(el)el.textContent=format(data.prices?.[k])});renderTicker(data)}catch(e){}};await load();setInterval(load,30000)})();</script>'''
                  s = s[:start] + script + s[end+9:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated price data
        run: |
          git config user.name "arshadtala-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json index.html
          git diff --cached --quiet || git commit -m "chore: update live market prices"
          git push
