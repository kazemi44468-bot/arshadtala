<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درخواست عضویت | ارشدطلا</title><link rel="stylesheet" href="/css/fonts.css"><link rel="stylesheet" href="/css/tokens.css"><link rel="stylesheet" href="/css/shared.css"><link rel="stylesheet" href="/css/components.css"><link rel="stylesheet" href="/css/base.css"></head><body><div data-header></div><div data-nav></div><main class="page-shell"><div class="container"><div class="page-title"><span class="eyebrow">عضویت در شبکه</span><h1>درخواست عضویت در ارشدطلا</h1><p>اطلاعات اولیه را ثبت کنید تا فرآیند عضویت و بررسی شرایط شبکه آغاز شود.</p></div><form class="card form-card"><div class="form-grid"><div class="field"><label for="name">نام و نام خانوادگی</label><input id="name" required autocomplete="name"></div><div class="field"><label for="mobile">شماره موبایل</label><input id="mobile" required type="tel" inputmode="tel" autocomplete="tel"></div><div class="field"><label for="ref">کد معرف</label><input id="ref" placeholder="در صورت داشتن معرف"></div><div class="field"><label for="activity">حوزه فعالیت</label><select id="activity"><option>انتخاب کنید</option><option>طلا و سکه</option><option>ارز</option><option>سنگ‌های قیمتی</option><option>سایر</option></select></div><div class="field full"><label for="note">توضیحات</label><textarea id="note" rows="5" placeholder="در صورت نیاز توضیح کوتاهی درباره زمینه فعالیت خود بنویسید."></textarea></div></div><div class="notice" style="margin:18px 0">عضویت نهایی منوط به بررسی اطلاعات، احراز هویت و تأیید شرایط عضویت شبکه است.</div><button class="btn btn-primary" type="submit">ارسال درخواست عضویت</button></form></div></main><div data-footer></div><div data-back-top></div><script src="/js/components.js"></script></body></html>
