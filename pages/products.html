<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصولات ارشدطلا</title><link rel="stylesheet" href="shared.css"><style>.products-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.product-card{overflow:hidden}.product-card img{width:100%;aspect-ratio:4/3;display:block;object-fit:cover}.product-body{padding:20px}.product-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.product-meta{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0;color:#777}.product-price{font-size:1.15rem;font-weight:700}.product-actions{display:flex;gap:10px;flex-wrap:wrap}.labor{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f5ecd4;color:#896715;font-size:.85rem;font-weight:700}@media(max-width:700px){.products-grid{grid-template-columns:1fr}}</style></head><body><nav class="floating-bar"><a href="../index.html"><i class="fas fa-home"></i><span class="tooltip">خانه</span></a><a href="market.html"><i class="fas fa-chart-pie"></i><span class="tooltip">بازار</span></a><a href="gold.html" class="active"><i class="fas fa-coins"></i><span class="tooltip">طلا و سکه</span></a><a href="currency.html"><i class="fas fa-dollar-sign"></i><span class="tooltip">ارز</span></a><a href="members.html"><i class="fas fa-users"></i><span class="tooltip">اعضا</span></a><a href="login.html"><i class="fas fa-user"></i><span class="tooltip">ورود</span></a></nav><main class="page-shell"><header class="page-head"><div class="eyebrow">فروش مستقیم</div><h1 class="section-title">محصولات <span>ارشدطلا</span></h1><p class="lead">منتخب طلاهای ۱۸ عیار با اجرت ۳٪ و ۴٪؛ وزن، قیمت و موجودی هر محصول در کارت آن نمایش داده می‌شود.</p></header><section class="content-section"><div class="products-grid" id="products"><div class="card" style="padding:30px">در حال دریافت محصولات...</div></div></section><footer class="footer">ارشدطلا · فروش مستقیم محصولات طلا</footer></main><script>const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const money=n=>n==null?'—':fa(Number(n).toLocaleString('en-US'))+' تومان';async function load(){const box=document.getElementById('products');try{const [pr,rt]=await Promise.all([fetch('../data/products.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('../data/prices.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())]);const gram=Number(rt.prices?.gold18||0);box.innerHTML=(pr.products||[]).map(p=>{const base=p.weight*gram;const final=Math.round(base*(1+p.labor/100));return '<article class="card product-card"><img src="../'+p.image+'" alt="'+p.name+'"><div class="product-body"><div class="product-top"><h2 style="margin:0;font-size:1.2rem">'+p.name+'</h2><span class="labor">اجرت '+fa(p.labor)+'٪</span></div><p style="color:#777;line-height:1.8">'+p.description+'</p><div class="product-meta"><span>وزن: <strong>'+fa(p.weight)+' گرم</strong></span><span>موجودی: <strong>'+fa(p.stock)+' عدد</strong></span></div><div class="product-price">قیمت تقریبی: '+money(final)+'</div><div class="product-actions"><a class="btn" href="login.html">ثبت سفارش</a><a class="btn" href="market.html">مشاهده بازار</a></div></div></article>'}).join('')||'<div class="card" style="padding:30px">محصولی ثبت نشده است.</div>'}catch(e){box.innerHTML='<div class="card" style="padding:30px">دریافت محصولات با مشکل مواجه شد.</div>'}}load();setInterval(load,30000)</script></body></html>
